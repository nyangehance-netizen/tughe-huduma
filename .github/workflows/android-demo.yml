name: Build Android app (demo APK)

# Builds an installable Android app from the web demo in docs/ and publishes it
# on the Releases page as "TUGHE-Huduma-demo.apk". Runs on every change to the demo,
# or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths: ["docs/**", "android-demo/**", ".github/workflows/android-demo.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-demo
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already includes the Android SDK (ANDROID_HOME); just accept its licences.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Capacitor
        run: npm install --no-audit --no-fund && pip install --quiet pillow

      - name: Build the members' app (TUGHE Huduma)
        run: ./build.sh member ${{ github.run_number }}

      - name: Build the officers' app (TUGHE Dawati)
        run: ./build.sh staff ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: TUGHE-demo-apks
          path: |
            android-demo/TUGHE-Huduma-demo.apk
            android-demo/TUGHE-Dawati-demo.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo-apk --yes --cleanup-tag || true
          gh release create demo-apk TUGHE-Huduma-demo.apk TUGHE-Dawati-demo.apk \
            --title "TUGHE Huduma & TUGHE Dawati – Android demo apps (build ${{ github.run_number }})" \
            --notes "**TUGHE-Huduma-demo.apk**: programu ya wanachama. **TUGHE-Dawati-demo.apk**: lango la maafisa (omba akaunti, idhini ya msimamizi, dawati). Pakua na ufungue kwenye simu ya Android; ikiuliza, ruhusu kusakinisha programu kutoka chanzo hiki.

          **TUGHE-Huduma-demo.apk** is the members' app. **TUGHE-Dawati-demo.apk** is the officers' portal (apply, admin approval, desk). Download and open on an Android phone; if asked, allow installing apps from this source.

          These are demos: they run offline, and accounts and cases stay on the phone that created them. Each app keeps its own data. The full apps with a shared server are in the \`mobile/\` folder."
