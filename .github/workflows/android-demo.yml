name: Build Android app (demo APK)

# Builds an installable Android app from the web demo in docs/ and publishes it
# on the Releases page as "TUGHE-Huduma-demo.apk". Runs on every change to the demo,
# or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths: ["docs/**", "android-demo/**", ".github/workflows/android-demo.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-demo
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Copy the demo into the app
        run: |
          mkdir -p www
          cp -r ../docs/. www/
          # The service worker is for the website only; the app already ships every file offline.
          sed -i 's#<script>if("serviceWorker" in navigator)[^<]*</script>##' www/index.html

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: npx cap add android && npx cap sync android

      - name: Apply TUGHE icon and splash screen
        run: |
          pip install --quiet pillow
          python3 make_icons.py ../docs/icon-512.png

      - name: Set version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android-demo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TUGHE-Huduma-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TUGHE-Huduma-demo-apk
          path: android-demo/TUGHE-Huduma-demo.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo-apk --yes --cleanup-tag || true
          gh release create demo-apk TUGHE-Huduma-demo.apk \
            --title "TUGHE Huduma – Android demo app (build ${{ github.run_number }})" \
            --notes "Pakua **TUGHE-Huduma-demo.apk** hapa chini na uifungue kwenye simu ya Android. Ikiuliza, ruhusu kusakinisha programu kutoka chanzo hiki.

          Download **TUGHE-Huduma-demo.apk** below and open it on an Android phone. If asked, allow installing apps from this source.

          This is the demo: it runs offline with example cases, and anything you enter stays on the phone. The full app with a shared server is in the \`mobile/\` folder."
