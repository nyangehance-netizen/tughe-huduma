<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TUGHE Huduma – Demo</title>
<meta name="description" content="TUGHE Huduma – kituo kimoja cha huduma kwa wanachama wa TUGHE: wasilisha tatizo, fuatilia shauri, uliza msaidizi.">
<meta name="theme-color" content="#2D3597">
<meta property="og:title" content="TUGHE Huduma – Demo">
<meta property="og:description" content="Member service centre for the Tanzania Union of Government and Health Employees.">

<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — brand bar, tab strip, one working panel at a time; staff desk is a list + detail split */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --sunk:#E9EBF6; --line:#D6DAEC;
  --ink:#12163A; --muted:#5A6082;
  --blue:#2D3597; --blue-ink:#FFFFFF; --blue-soft:#E3E5F6;
  --sky:#3B5BDB; --sky-soft:#E5EAFB; --sky-ink:#1E2A78;
  --ok:#1F7A4D; --ok-soft:#DDF2E6; --warn:#A35F00; --warn-soft:#FFEFD3; --bad:#B23A2B; --bad-soft:#FBE3DE; --info:#44507E; --info-soft:#E6E8F2;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D1F; --surface:#12152E; --sunk:#0E1026; --line:#262A4D;
  --ink:#E8E9F6; --muted:#9A9EC0;
  --blue:#8C95F2; --blue-ink:#0B0D2A; --blue-soft:#1E2350;
  --sky:#9DB4FF; --sky-soft:#1B2550; --sky-ink:#C9D5FF;
  --ok:#6BD39C; --ok-soft:#173B28; --warn:#F2B35C; --warn-soft:#3B2A10; --bad:#F08A7A; --bad-soft:#3F1D18; --info:#AEB4D8; --info-soft:#1C2040;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D1F; --surface:#12152E; --sunk:#0E1026; --line:#262A4D;
  --ink:#E8E9F6; --muted:#9A9EC0;
  --blue:#8C95F2; --blue-ink:#0B0D2A; --blue-soft:#1E2350;
  --sky:#9DB4FF; --sky-soft:#1B2550; --sky-ink:#C9D5FF;
  --ok:#6BD39C; --ok-soft:#173B28; --warn:#F2B35C; --warn-soft:#3B2A10; --bad:#F08A7A; --bad-soft:#3F1D18; --info:#AEB4D8; --info-soft:#1C2040;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* brand bar */
.bar{background:#2D3597;color:#FFFFFF}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.mark{width:52px;height:52px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;flex:none;padding:2px;box-shadow:0 0 0 2px color-mix(in srgb,#FFFFFF 50%,transparent)}.mark img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:700}
.brand span{font-size:12.5px;opacity:.85}
.lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 12px;cursor:pointer;color:#FFFFFF;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:#FFFFFF;color:#2D3597}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.count{background:var(--sky-soft);color:var(--sky-ink);border-radius:999px;font-size:11.5px;padding:0 7px;font-weight:700}

main{padding-block:24px 56px}
.panel{display:flex;flex-direction:column;gap:22px}
.note{background:var(--sky-soft);color:var(--sky-ink);border-radius:var(--r);padding:10px 14px;font-size:13.5px}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:stretch}
.hero-main{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);font-weight:700}
.hero h1{font-size:clamp(26px,4.2vw,40px);font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);max-width:58ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.gold{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.small{padding:6px 11px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.track{background:var(--blue-soft);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.track h2{font-size:19px}
.track p{margin:0;font-size:14px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px;align-items:start}
.steps li b{width:26px;height:26px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-size:12.5px;font-family:var(--f-mono)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:21px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;text-align:left;cursor:pointer;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.cat:hover{border-color:var(--blue)}
.cat .ic{width:36px;height:36px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.cat .ic svg{width:19px;height:19px}
.cat b{display:block;font-size:14.5px}
.cat span{font-size:13px;color:var(--muted);line-height:1.4}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
label,.lbl{font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:120px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;background:var(--surface);font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.err{color:var(--bad);font-size:13px}
.confirm{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.ref{font-family:var(--f-mono);font-size:24px;background:var(--blue-soft);color:var(--blue);padding:6px 14px;border-radius:8px}

/* case list */
.cases{display:flex;flex-direction:column;gap:12px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.case-head{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:15px 18px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.case-head h3{font-size:16.5px;font-family:var(--f-body);font-weight:700}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;align-self:start}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-received{background:var(--info-soft);color:var(--info)}
.s-review{background:var(--warn-soft);color:var(--warn)}
.s-action{background:var(--blue);color:var(--blue-ink)}
.s-resolved{background:var(--ok-soft);color:var(--ok)}
.s-closed{background:var(--sunk);color:var(--muted)}
.u-high{color:var(--bad);font-weight:700}
.case-body{border-top:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.progress div{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.progress i{height:5px;border-radius:3px;background:var(--sunk)}
.progress .on i{background:var(--blue)}
.progress .on{color:var(--ink);font-weight:600}
.desc{white-space:pre-wrap;margin:0;font-size:14.5px;max-width:70ch}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{max-width:min(560px,92%);padding:9px 13px;border-radius:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg small{display:block;font-size:11.5px;opacity:.75;margin-top:3px}
.msg.member{align-self:flex-end;background:var(--blue);color:var(--blue-ink);border-bottom-right-radius:3px}
.msg.staff{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:3px}
.msg.staff b{font-size:12px;color:var(--blue)}
.reply{display:flex;gap:8px;align-items:flex-end}
.reply textarea{min-height:44px;height:44px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:32px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:46ch}
.example-tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--sunk);color:var(--muted);padding:2px 7px;border-radius:4px}

/* staff desk */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.stat[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters > *{flex:1 1 170px;width:auto}
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
.qlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:640px;overflow-y:auto}
.qitem{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.qitem[aria-current="true"]{background:var(--blue-soft)}
.qitem b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{position:sticky;top:64px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0}
.kv dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kv dd{margin:0;font-size:14px;overflow-wrap:anywhere}

/* help + contact */
.guides{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
details.guide{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
details.guide summary{padding:14px 16px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.guide summary::after{content:"+";color:var(--blue);font-size:18px;line-height:1}
details.guide[open] summary::after{content:"–"}
details.guide .gbody{padding:0 16px 16px;font-size:14px;display:flex;flex-direction:column;gap:8px}
details.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.law{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.contact .v{font-family:var(--f-mono);font-size:15px;user-select:all;overflow-wrap:anywhere}

/* assistant */
.chat{display:flex;flex-direction:column;gap:12px}
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:120px}
.suggest{display:flex;gap:8px;flex-wrap:wrap}

footer{border-top:1px solid var(--line);padding-block:18px;color:var(--muted);font-size:12.5px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .desk{grid-template-columns:1fr}
  .detail{position:static}
  .stats{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:560px){
  .form{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .progress div span{font-size:10.5px}
  .kv{grid-template-columns:1fr}
  .hero-main{padding:20px}
}
@media (prefers-reduced-motion:no-preference){.case-body,.detail .card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}

@media (max-width:560px){.brand span{display:none}.brand b{font-size:15px}.bar .wrap{padding-block:10px}}
/* SLA + back office */
.sla{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.sla.bad{background:var(--bad-soft);color:var(--bad)}
.sla.warn{background:var(--warn-soft);color:var(--warn)}
.sla.ok{background:var(--ok-soft);color:var(--ok)}
.sla.neutral{background:var(--sunk);color:var(--muted)}
.qitem.overdue{box-shadow:inset 4px 0 0 var(--bad)}
.qitem.soon{box-shadow:inset 4px 0 0 var(--warn)}
.stats{grid-template-columns:repeat(6,1fr)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
.views{display:flex;gap:8px;flex-wrap:wrap}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.box h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.duegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duegrid div{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.duegrid span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.notes{display:flex;flex-direction:column;gap:6px}
.notes .n{background:var(--warn-soft);border-radius:8px;padding:8px 11px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.notes .n small{display:block;color:var(--muted);font-size:11.5px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.log li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.log time{font-family:var(--f-mono);font-size:11.5px}
.msg.botmsg{align-self:flex-start;background:var(--sky-soft);color:var(--ink);border-bottom-left-radius:3px}
.msg.botmsg b{font-size:12px;color:var(--sky)}
.member-sla{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.member-sla b{color:var(--ink);font-weight:600}

/* chat bot */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:#2D3597;color:#FFFFFF;border:3px solid #FFFFFF;border-radius:999px;padding:10px 16px 10px 12px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(20,24,80,.28)}
.fab svg{width:22px;height:22px}
.bot{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:31;width:min(390px,calc(100vw - 32px));height:min(600px,calc(100% - 100px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 44px rgba(10,14,60,.25);display:flex;flex-direction:column;overflow:hidden}
.bot-head{background:#2D3597;color:#FFFFFF;padding:12px 14px;display:flex;align-items:center;gap:10px}
.bot-head img{width:34px;height:34px;border-radius:50%;background:#FFFFFF;padding:1px}
.bot-head div{flex:1;min-width:0;display:flex;flex-direction:column}
.bot-head b{font-family:var(--f-display);font-size:15.5px}
.bot-head span{font-size:12px;opacity:.85}
.bot-head button{background:none;border:0;color:#FFFFFF;font-size:22px;line-height:1;cursor:pointer;padding:4px 8px}
.bot-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.bot-log .msg{max-width:88%}
.bot-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bot-acts button{border:1px solid var(--sky);background:var(--surface);color:var(--sky);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.bot-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.bot-in input{flex:1;min-width:0}
.typing{font-size:12.5px;color:var(--muted)}
@media (max-width:820px){.stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.duegrid{grid-template-columns:1fr}.bot{right:0;left:0;bottom:0;width:100%;height:calc(100% - 40px);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}.fab span{display:none}.fab{padding:12px}}
.demo-note{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-note a.btn{text-decoration:none;color:inherit}
</style>
</head>
<body>

function fmtDate(ts){ if(!ts) return "—"; return new Date(ts).toLocaleDateString(lang==="sw"?"sw-TZ":"en-GB",{weekday:"short",day:"numeric",month:"short"}); }
function fmtFull(ts){ if(!ts) return "—"; return new Date(ts).toLocaleDateString(lang==="sw"?"sw-TZ":"en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function ago(ts){ const s=(Date.now()-ts)/1000, a=t().ago; if(s<60) return a.now; if(s<3600) return Math.floor(s/60)+" "+a.m; if(s<86400) return Math.floor(s/3600)+" "+a.h; if(s<86400*14) return Math.floor(s/86400)+" "+a.d; return fmtFull(ts); }
function addWorkDays(ts,n){ const d=new Date(ts); let k=0; while(k<n){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) k++; } d.setHours(17,0,0,0); return d.getTime(); }
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function newRef(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return "TGH-"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+Math.random().toString(36).slice(2,6).toUpperCase(); }

/* SLA status of a case */
function slaOf(c){
  const L=t().sla, now=Date.now();
  if(!isOpen(c)){ const days=Math.max(0,Math.round(((c.resolvedAt||c.updatedAt)-c.createdAt)/D)); return {cls:"ok",level:0,text:lang==="sw"?`${L.done} ${days}`:`${L.done} ${days}`}; }
  if(!c.firstResponseAt && c.respondBy && now>c.respondBy) return {cls:"bad",level:3,text:L.noReply};
  const days = Math.round((startOfDay(c.dueAt)-startOfDay(now))/D);
  if(days<0) return {cls:"bad",level:3,text:lang==="sw"?`${L.late} ${-days}`:`${L.late} ${-days}`};
  if(days===0) return {cls:"warn",level:2,text:L.today};
  if(days<=2) return {cls:"warn",level:2,text:`${days} ${L.left}`};
  return {cls:"neutral",level:1,text:`${days} ${L.left}`};
}
const slaChip = c => { const s=slaOf(c); return `<span class="sla ${s.cls}">${esc(s.text)}</span>`; };

/* ================= keep typed text across re-renders ================= */
function keep(fn){
  const vals={}; document.querySelectorAll("[data-keep]").forEach(el=>vals[el.id]=el.value);
  const a=document.activeElement, aid=a&&a.id, pos=a&&a.selectionStart;
  fn();
  for(const id in vals){ const el=document.getElementById(id); if(el&&vals[id]) el.value=vals[id]; }
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} } }
}

async function submitCase(e){
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const c={ name:v("f-name"),check:v("f-check"),employer:v("f-employer"),station:v("f-station"),region:v("f-region"),phone:v("f-phone"),member:v("f-member"),category:v("f-cat"),title:v("f-title"),desc:v("f-desc"),urgency:S.formUrg,contact:S.formContact };
  const err=$("#f-err");
  if(!c.name||!c.check||!c.employer||!c.region||!c.phone||!c.category||!c.title||!c.desc){ err.textContent=t().required; err.hidden=false; return; }
  err.hidden=true;
  /* auto-triage: urgent categories or urgent keywords */
  const cat=catById(c.category);
  const urgentKw=/kufukuz|kuachishwa|kusimamish|unyanyas|ajali|jeraha|dismiss|terminat|suspend|harass|injur|accident/i;
  if(c.urgency!=="high" && (cat.urgent || urgentKw.test(c.title+" "+c.desc))){ c.urgency="high"; c.autoUrgent=true; }
  const id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const ts=Date.now();
  Object.assign(c,{id,ref:newRef(),status:"received",officer:"",officerId:"",createdAt:ts,updatedAt:ts,
    respondBy:addWorkDays(ts,SLA[c.urgency].respond), dueAt:addWorkDays(ts,SLA[c.urgency].resolve), firstResponseAt:0, resolvedAt:0, resolution:""});
  /* bot auto-acknowledgement with document checklist */
  c.messages=[{from:"bot",text:t().ack(c,cat[lang][0],(cat.docs||{})[lang]||[],fmtDate(c.respondBy)),at:ts}];
  const btn=$("#f-submit"); btn.disabled=true;
  if(S.demo){ S.mine[id]=c; S.all.unshift(Object.assign({uid:"demo"},c)); saveDemo(); }
  else{
    try{
      const ref=S.db.doc("cases/"+S.uid);
      const snap=await ref.get();
      if(snap.exists) await ref.update({cases:{[id]:c},updatedAt:ts});
      else await ref.set({owner:S.uid,updatedAt:ts,cases:{[id]:c}});
    }catch(x){
      btn.disabled=false;
      if(x&&x.code==="invalid_argument"){ S.canWrite=false; err.textContent=t().noWrite; }
      else err.textContent=t().saveErr+(x&&x.code?" ("+x.code+")":"");
      err.hidden=false; return;
    }
  }
  try{ sessionStorage.removeItem("tughe-draft"); }catch(e){}
  S.lastCase=c; S.formCat=""; S.formUrg="normal"; S.open=id; renderTabs(); rNew();
}

function thread(msgs, viewer){
  const L=t();
  if(!msgs||!msgs.length) return `<p class="hint" style="margin:0">${esc(L.noMsgs)}</p>`;
  return `<div class="thread">${msgs.map(m=>{
    if(m.from==="bot") return `<div class="msg botmsg"><b>${esc(L.botName)}</b><br>${esc(m.text)}<small>${esc(ago(m.at))}</small></div>`;
    const cls = viewer==="staff" ? (m.from==="staff"?"member":"staff") : m.from;
    const who = m.from==="staff" ? (m.by||L.tughe) : "";
    return `<div class="msg ${cls}">${cls==="staff"&&who?`<b>${esc(who)}</b><br>`:""}${esc(m.text)}<small>${cls==="member"&&viewer==="staff"&&who?esc(who)+" · ":""}${esc(ago(m.at))}</small></div>`;

function rDeskInner(){
  const L=t(), F=S.deskFilter, src=deskSource();
  if(!src.length){
    $("#p-desk").innerHTML=`<div class="sec-h"><h2>${esc(L.deskH)}</h2><p>${esc(L.deskP)}</p></div><div class="empty"><h3>${esc(L.deskEmptyH)}</h3><p>${esc(L.deskEmptyP)}</p></div>`; return;
  }
  const openC=src.filter(isOpen), now=Date.now();
  const doneRecent=src.filter(c=>!isOpen(c)&&(c.resolvedAt||c.updatedAt)>now-30*D);

async function staffWrite(c, patch, logText){
  patch.updatedAt=Date.now();
  const entry = logText ? {at:Date.now(),by:me(),text:logText} : null;
  if(S.demo||c.example||c.uid==="demo"){
    Object.assign(c,patch); if(S.mine[c.id]) Object.assign(S.mine[c.id],patch);
    if(entry){ const sd=S.staffDocs[c.id]||(S.staffDocs[c.id]={notes:[],log:[]}); sd.log=(sd.log||[]).concat([entry]); }
    saveDemo(); renderTabs(); rDesk(); return true;
  }
  try{
    await S.db.doc("cases/"+c.uid).update({cases:{[c.id]:patch},updatedAt:patch.updatedAt});
    if(entry) await staffDocWrite(c.id, sd=>({log:(sd.log||[]).concat([entry]).slice(-60)}));
    return true;
  }catch(e){ return false; }
}
async function staffDocWrite(caseId, fn){
  const sd=S.staffDocs[caseId]||{}; const next=Object.assign({notes:sd.notes||[],log:sd.log||[]},fn(sd));
  if(S.demo||!S.db){ S.staffDocs[caseId]=next; saveDemo(); rDesk(); return; }
  await S.db.doc("staff/"+caseId).set(next);
}

  const B=t().bot, L=t();

function botAsk(q){
  q=(q||"").trim(); if(!q||S.botBusy) return;
  S.bot.push({role:"user",text:q}); S.botHist.push({role:"user",content:q});
  const B=t().bot, A=B.act;
  const myCases = Object.values(S.mine).length ? Object.values(S.mine) : (S.demo?EXAMPLES:[]);
  const pool = myCases.concat(S.isStaff?deskSource():[]);
  const refM = q.match(/TGH-\d{6}-[A-Z0-9]{4}/i);
  if(refM){
    const c=pool.find(x=>x.ref.toUpperCase()===refM[0].toUpperCase());
    return botSay(c?caseSummaryLine(c):B.notFound, c?[{label:A.mine,go:"mine"}]:[{label:A.mine,go:"mine"},{label:A.contact,go:"contact"}]);
  }
  if(/fuatilia|hali ya shauri|shauri langu|mashauri yangu|track|status|my case/i.test(q)){
    if(!myCases.length) return botSay(B.noCases,[{label:A.report,go:"new"}]);
    return botSay(B.yourCases+"\n\n"+myCases.slice(0,5).map(caseSummaryLine).join("\n\n"),[{label:A.mine,go:"mine"}]);
  }
  if(/^(habari|mambo|hujambo|salama|shikamoo|hello|hi|hey|good (morning|afternoon|evening))\b/i.test(q) && q.length<30) return botSay(B.greet,quickActs());
  if(/^(asante|ahsante|thanks|thank you|sawa)\b/i.test(q) && q.length<30) return botSay(B.thanks);
  if(/jiunga|join|kuwa mwanachama|become a member/i.test(q)) return botSay(B.join,[{label:A.report,cat:"membership"},{label:A.guide,go:"help",guide:"membership"}]);
  if(/mawasiliano|namba ya simu|simu ya|barua pepe|anwani|ofisi iko|contact|phone|email|address|where is/i.test(q)) return botSay(B.contacts,[{label:A.contact,go:"contact"}]);
  if(/likizo|leave|maternity|paternity|uzazi|ubaba/i.test(q) && /siku ngapi|ngapi|how many|days|muda|haki|entitle/i.test(q)) return botSay(B.leave,[{label:A.report,cat:"leave"},{label:A.guide,go:"help",guide:"leave"}]);
  const cat = CATS.find(c=>c.kw&&c.kw.test(q));
  const wantsReport = /wasilisha|lalamik|ripoti|report|complain|submit|fungua shauri/i.test(q);
  if(cat && !S.sample){
    const txt=(cat.urgent?B.urgentNote+"\n\n":"")+B.catIntro+"\n• "+cat.g[lang].join("\n• ")+"\n\n"+B.more;
    return botSay(txt,[{label:A.report,cat:cat.id},{label:A.guide,go:"help",guide:cat.id}]);
  }
  if(wantsReport && !cat){ go("new"); return botSay(B.report,[]); }
  if(S.sample) return botAI(q,cat);
  return botSay(B.fallback,[{label:A.report,go:"new"},{label:A.contact,go:"contact"}]);
}
async function botAI(q,cat){
  const B=t().bot, A=B.act;
  const m={role:"bot",text:"",acts:[]}; S.bot.push(m); S.botBusy=true; drawBot();
  const guide = cat ? `Relevant TUGHE guidance for this topic: ${cat.g.en.join(" ")} Law: ${cat.law}.` : "";
  const sys=`You are the TUGHE Assistant, the help bot of TUGHE (Tanzania Union of Government and Health Employees), a trade union for public servants and health workers in Tanzania. Reply in ${lang==="sw"?"Kiswahili":"English"}, plain text, no markdown, at most 120 words. Give practical general guidance on Tanzanian labour rights (Employment and Labour Relations Act 2004, Public Service Act Cap 298, OSHA 2003, Workers Compensation Act, PSSSF Act 2018). Never invent exact figures, deadlines, fees or office hours you are unsure of; when timing matters, tell the member to report the case or contact TUGHE today. TUGHE head office: Mkoani Street Plot 189 Kibaha, phone 023 240 2534, info@tughe.or.tz. Service promise: urgent cases answered within 1 working day, normal within 3. ${guide} On the final line write exactly CATEGORY=<one of: ${CATS.map(c=>c.id).join(", ")}, none>.`;
  const turns=[{role:"user",content:sys},{role:"assistant",content:"OK."}].concat(S.botHist.slice(-8));
  let cid="";
  try{
    const r=await S.sample(turns,{cache:false,modelTier:"quick",onText:({text})=>{ m.text=text.replace(/\n?CATEGORY=\w*\s*$/,""); drawBot(); }});
    const mm=(r.text||"").match(/CATEGORY=(\w+)/); cid = mm&&CATS.some(c=>c.id===mm[1]) ? mm[1] : (cat?cat.id:"");
    m.text=(r.text||"").replace(/\n?CATEGORY=\w*\s*$/,"").trim();
  }catch(x){
    if(x&&x.code==="not_granted") S.sample=null;
    if(cat){ m.text=(cat.urgent?B.urgentNote+"\n\n":"")+B.catIntro+"\n• "+cat.g[lang].join("\n• ")+"\n\n"+B.more; cid=cat.id; }
    else m.text=B.aiErr;
  }
  S.botHist.push({role:"assistant",content:m.text});
  m.acts = cid&&cid!=="none" ? [{label:A.report,cat:cid},{label:A.guide,go:"help",guide:cid}] : [{label:A.report,go:"new"},{label:A.contact,go:"contact"}];
  S.botBusy=false; drawBot();
}

/* ================= language ================= */
function setLang(l){
  lang=l; try{ localStorage.setItem("tughe-lang",l); }catch(e){}
  document.documentElement.lang=l;
  $("#lang-sw").setAttribute("aria-pressed",l==="sw"); $("#lang-en").setAttribute("aria-pressed",l==="en");
  $("#brandName").textContent=t().brand; $("#brandSub").textContent=t().sub; $("#foot").textContent=t().foot;
  $("#fabLbl").textContent=t().bot.fab; $("#botName").textContent=t().bot.name; $("#botSub").textContent=t().bot.sub; $("#botInput").placeholder=t().bot.ph; $("#bot").setAttribute("aria-label",t().bot.name);
  const dn=$("#demoNote"); $("#demoText").textContent=t().demo; $("#demoReset").textContent=lang==="sw"?"Anza upya":"Reset demo"; dn.hidden=!(S.demo&&S.ready);
  renderTabs(); renderPanel(S.tab); if(S.botOpen) drawBot();
}
$("#lang-sw").onclick=()=>setLang("sw"); $("#lang-en").onclick=()=>setLang("en");
const logoImg=document.querySelector(".mark img"); if(logoImg) $("#botLogo").src=logoImg.src;

/* ================= boot ================= */
/* ---- public demo: keep what the visitor does on this device ---- */
const DEMO_KEY="tughe-demo-v1";
function saveDemo(){ try{ localStorage.setItem(DEMO_KEY, JSON.stringify({mine:S.mine, all:S.all, staff:S.staffDocs, ex:EXAMPLES})); }catch(e){} }
function loadDemo(){ try{ const d=JSON.parse(localStorage.getItem(DEMO_KEY)||"null"); if(!d) return;
  S.mine=d.mine||{}; S.all=(d.all||[]).map(x=>S.mine[x.id]?Object.assign(S.mine[x.id],{uid:"demo"}):x); S.staffDocs=d.staff||{};
  if(Array.isArray(d.ex)&&d.ex.length===EXAMPLES.length) d.ex.forEach((x,i)=>Object.assign(EXAMPLES[i],x)); }catch(e){} }
function resetDemo(){ try{ localStorage.removeItem(DEMO_KEY); sessionStorage.clear(); }catch(e){} location.reload(); }
loadDemo();
document.getElementById("demoReset").onclick=resetDemo;
setLang(lang); go("home");

(async function connect(){
  if(!window.claude||!window.claude.use){ S.isStaff=true; S.ready=true; setLang(lang); return; }
  try{
    const [db,user,sample] = await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);
    S.sample = sample || null;
    if(db && user){
      const uid = await user.id();
      if(uid){
        S.db=db; S.uid=uid; S.demo=false;
        try{ S.myName = (await user.name()) || ""; }catch(e){}
        try{ S.isStaff = !!(await user.canEdit()); }catch(e){}
        try{ const cw = await user.can("data.write"); if(cw===false) S.canWrite=false; }catch(e){}
        db.doc("cases/"+uid).onSnapshot(snap=>{
          const d = snap.exists ? snap.data() : null;
          S.mine = d && d.cases ? JSON.parse(JSON.stringify(d.cases)) : {};
          renderTabs(); if(S.tab==="mine") keep(rMine);
        },()=>{});
        if(S.isStaff){
          db.collection("cases").onSnapshot(qs=>{
            const all=[];
            qs.docs.forEach(doc=>{ const d=doc.data()||{}; Object.values(d.cases||{}).forEach(c=>all.push(Object.assign({uid:doc.id},JSON.parse(JSON.stringify(c))))); });
            S.all=all; renderTabs(); if(S.tab==="desk") rDesk();
          },()=>{});
          db.collection("staff").onSnapshot(qs=>{
            const m={}; qs.docs.forEach(doc=>m[doc.id]=JSON.parse(JSON.stringify(doc.data()||{})));
            S.staffDocs=m; if(S.tab==="desk") rDesk();
          },()=>{});
        }
      }
    }
  }catch(e){}
  if(S.demo) S.isStaff = true; /* show the desk with examples in demo mode */
  S.ready=true; setLang(lang);
  setInterval(()=>{ renderTabs(); },60000);
})();
})();
</script>
